# Example custom settings file
# Use by setting: COMMONDB_SETTINGS_FILE=/path/to/this/file.toml

[app]
host = "127.0.0.1"
port = 9000
debug = true

[api]
default_route = "/api-docs"
gzip_response_minimum_size = 512

[log]
level = "DEBUG"

[service.rbac]
user_invitation_time_to_live = 3600  # 1 hour instead of default 1 week