version: 1
disable_existing_loggers: false

formatters:
  json:
    "()": gen_epix.commondb.config.json_logging.JsonFormatter
    # optional: set explicit service/env; if omitted it reads SERVICE_NAME / ENVIRONMENT env vars
    service: "casedb"
    merge_message_json: true
    extras_key: "props"
    redacted_value: "[REDACTED]"
    sensitive_keys: ["client_secret", "password", "client_pwd", "secret", "api_key"]

filters:
  uvicorn_access_structured:
    (): gen_epix.commondb.config.json_logging.UvicornAccessLogFilter

handlers:
  console:
    class: logging.StreamHandler
    # startup normalises handler level to NOTSET; cfg.py set_log_level() controls filtering via logger levels
    level: INFO
    formatter: json
    stream: ext://sys.stdout

loggers:
  casedb.setup:
    level: INFO
    handlers: [console]
    propagate: no
  casedb.service:
    level: INFO
    handlers: [console]
    propagate: no
  casedb.app:
    level: INFO
    handlers: [console]
    propagate: no
  casedb.api:
    level: INFO
    handlers: [console]
    propagate: no
  casedb.external:
    level: INFO
    handlers: [console]
    propagate: no
  seqdb.setup:
    level: INFO
    handlers: [console]
    propagate: no
  seqdb.service:
    level: INFO
    handlers: [console]
    propagate: no
  seqdb.app:
    level: INFO
    handlers: [console]
    propagate: no
  seqdb.api:
    level: INFO
    handlers: [console]
    propagate: no
  seqdb.external:
    level: INFO
    handlers: [console]
    propagate: no
  omopdb.setup:
    level: INFO
    handlers: [console]
    propagate: no
  omopdb.service:
    level: INFO
    handlers: [console]
    propagate: no
  omopdb.app:
    level: INFO
    handlers: [console]
    propagate: no
  omopdb.api:
    level: INFO
    handlers: [console]
    propagate: no
  omopdb.external:
    level: INFO
    handlers: [console]
    propagate: no
  uvicorn.error:
    level: INFO
    handlers: [console]
    propagate: no
  uvicorn.access:
    level: INFO
    handlers: [console]
    filters: [uvicorn_access_structured]
    propagate: no
root:
  level: INFO
  handlers: [console]
