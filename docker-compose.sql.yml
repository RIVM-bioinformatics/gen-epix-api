# SA_SQL compose stack — SQL Server 2022 backend with persistent storage.
# Starts CASEDB (8000), SEQDB (8001), OMOPDB (8002) against an empty but
# fully-initialized SQL Server schema. Use this to reproduce lsp-data seeding
# behaviour locally.
#
# Usage:
#   docker compose -f docker-compose.sql.yml up --wait
#   docker compose -f docker-compose.sql.yml down        # keep data
#   docker compose -f docker-compose.sql.yml down -v     # wipe data
#
# The existing docker-compose.yml (DICT_EMPTY, ephemeral) is unaffected.

services:

  lsp_sql:
    image: mcr.microsoft.com/mssql/server:2025-latest@sha256:86cc6144ef39bb0fbed2329e1ad79b13ee82e7b2e4739213a0db0800e668a74a
    user: root
    environment:
      MSSQL_SA_PASSWORD: "Your_password123"
      ACCEPT_EULA: "Y"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - lsp_sql_data:/var/opt/mssql
    healthcheck:
      # Fall back to the older tools path for forward-compatibility.
      test:
        - "CMD-SHELL"
        - >
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P 'Your_password123' -C -Q 'SELECT 1' 2>/dev/null
          || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa
          -P 'Your_password123' -Q 'SELECT 1' 2>/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot container: creates the three databases then exits.
  # create_sa_repository() handles schemas + tables on app startup.
  init-db:
    image: mcr.microsoft.com/mssql/server:2025-latest@sha256:86cc6144ef39bb0fbed2329e1ad79b13ee82e7b2e4739213a0db0800e668a74a
    depends_on:
      lsp_sql:
        condition: service_healthy
    command:
      - bash
      - -c
      - >
        /opt/mssql-tools18/bin/sqlcmd -S lsp_sql -U sa
        -P 'Your_password123' -C
        -Q "IF DB_ID('casedb') IS NULL CREATE DATABASE casedb;
            IF DB_ID('seqdb')  IS NULL CREATE DATABASE seqdb;
            IF DB_ID('omopdb') IS NULL CREATE DATABASE omopdb;"
        2>/dev/null
        || /opt/mssql-tools/bin/sqlcmd -S lsp_sql -U sa
        -P 'Your_password123'
        -Q "IF DB_ID('casedb') IS NULL CREATE DATABASE casedb;
            IF DB_ID('seqdb')  IS NULL CREATE DATABASE seqdb;
            IF DB_ID('omopdb') IS NULL CREATE DATABASE omopdb;"
    restart: "no"

  seqdb:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: python run.py api SEQDB NONE SA_SQL --noreload
    environment:
      SEQDB_REPOSITORY__DEFAULTS__PROPS__SERVER: lsp_sql
    ports:
      - "8001:8001"
    depends_on:
      init-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8001/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  omopdb:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: python run.py api OMOPDB NONE SA_SQL --noreload
    environment:
      OMOPDB_REPOSITORY__DEFAULTS__PROPS__SERVER: lsp_sql
    ports:
      - "8002:8002"
    depends_on:
      init-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8002/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  casedb:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: python run.py api CASEDB NONE SA_SQL --noreload
    environment:
      CASEDB_REPOSITORY__DEFAULTS__PROPS__SERVER: lsp_sql
      # casedb's embedded LOCAL seqdb loads its config under the SEQDB_ prefix,
      # so the server override must be set here too.
      SEQDB_REPOSITORY__DEFAULTS__PROPS__SERVER: lsp_sql
    ports:
      - "8000:8000"
    depends_on:
      init-db:
        condition: service_completed_successfully
      # seqdb must be healthy before casedb starts: both the standalone seqdb
      # service and casedb's embedded LOCAL seqdb share the same seqdb database.
      # Ordering ensures seqdb creates the root user first so that casedb's
      # embedded seqdb finds it already present (user_manager handles this
      # idempotently, but ordering eliminates any residual race condition).
      seqdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  lsp_sql_data:
