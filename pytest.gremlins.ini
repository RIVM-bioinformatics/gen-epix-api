[pytest]
markers =
    scenario_ids(id): Custom marker for scenario IDs used in test reporting.
    integration: Marker for integration tests.
filterwarnings =
    ignore:.*shadows an attribute in parent.*
norecursedirs =
    mutants
addopts =
    --ignore=test/casedb/custom
    --ignore=test/casedb/performance
    --ignore=test/seqdb/performance
