# Copy this file to secrets.repository.sa_sql.toml (dropping the ".example"
# part of the filename) and uncomment whichever values this deployment's SQL
# Server instance actually needs — most commonly just uid/pwd/server. Any
# field left commented out keeps its built-in default (see
# CasedbAppCfg._DEFAULT_SETTINGS in gen_epix/casedb/config/cfg.py); an
# environment-variable override works the same as it does for every other
# setting and does not require this file at all.

[repository.defaults.props]
# driver = "ODBC Driver 18 for SQL Server"
# server = "127.0.0.1"
# database = "casedb"
# uid = "sa"
# pwd = "changeme"
# other = ";TrustServerCertificate=yes"
