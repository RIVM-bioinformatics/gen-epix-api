version: 1
disable_existing_loggers: false

formatters:
  json:
    "()": gen_epix.commondb.domain.json_logging.JsonFormatter
    # optional: set explicit service/env; if omitted it reads SERVICE_NAME / ENVIRONMENT env vars
    service: "casedb"
    merge_message_json: true
    extras_key: "props"

filters:
  uvicorn_access_structured:
    (): gen_epix.commondb.domain.json_logging.UvicornAccessLogFilter

handlers:
  console:
    class: logging.StreamHandler
    # keep a fixed level; cfg.py set_log_level() will raise/lower levels at runtime anyway
    level: INFO
    formatter: json
    stream: ext://sys.stdout

loggers:
  casedb.setup:
    level: INFO
    handlers: [console]
    propagate: false
  casedb.service:
    level: INFO
    handlers: [console]
    propagate: false
  casedb.app:
    level: INFO
    handlers: [console]
    propagate: false
  casedb.api:
    level: INFO
    handlers: [console]
    propagate: false
  casedb.external:
    level: INFO
    handlers: [console]
    propagate: false
  uvicorn.error:
    level: INFO
    handlers: [console]
    propagate: false
  uvicorn.access:
    level: INFO
    handlers: [console]
    filters: [uvicorn_access_structured]
    propagate: false
  # Levels scale DEBUG(10) < INFO(20) < WARNING(30) < ERROR(40); each logger emits at its configured level and above.
  # sqlalchemy.engine/pool → WARNING: INFO emits full SQL text on every query (verbose, PII risk, Monitoring Platform noise).
  # httpx → INFO: redirects and auth events arrive at INFO and are operationally relevant; asyncio → WARNING: its INFO is pure event-loop infra.
  sqlalchemy.engine:
    level: WARNING
    handlers: [console]
    propagate: false
  sqlalchemy.pool:
    level: WARNING
    handlers: [console]
    propagate: false
  httpx:
    level: INFO
    handlers: [console]
    propagate: false
  asyncio:
    level: WARNING
    handlers: [console]
    propagate: false

root:
  level: INFO
  handlers: [console]