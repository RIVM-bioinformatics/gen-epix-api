version: 1
disable_existing_loggers: false

formatters:
  json:
    "()": gen_epix.commondb.domain.json_logging.JsonFormatter
    # optional: set explicit service/env; if omitted it reads SERVICE_NAME / ENVIRONMENT env vars
    service: "omopdb"
    merge_message_json: true
    extras_key: "props"

filters:
  uvicorn_access_structured:
    (): gen_epix.commondb.domain.json_logging.UvicornAccessLogFilter

handlers:
  console:
    class: logging.StreamHandler
    # keep a fixed level; cfg.py set_log_level() will raise/lower levels at runtime anyway
    level: INFO
    formatter: json
    stream: ext://sys.stdout

loggers:
  opomdb.setup:
    level: INFO
    handlers: [console]
    propagate: false
  opomdb.service:
    level: INFO
    handlers: [console]
    propagate: false
  opomdb.app:
    level: INFO
    handlers: [console]
    propagate: false
  opomdb.api:
    level: INFO
    handlers: [console]
    propagate: false
  opomdb.external:
    level: INFO
    handlers: [console]
    propagate: false
  uvicorn.error:
    level: INFO
    handlers: [console]
    propagate: false
  uvicorn.access:
    level: INFO
    handlers: [console]
    filters: [uvicorn_access_structured]
    propagate: false
  # Third-party loggers: route through JsonFormatter at WARNING to suppress
  # routine INFO noise (SQL queries, pool events, HTTP details) while keeping
  # errors visible. propagate: false prevents double-emission to root.
  sqlalchemy.engine:
    level: WARNING
    handlers: [console]
    propagate: false
  sqlalchemy.pool:
    level: WARNING
    handlers: [console]
    propagate: false
  httpx:
    level: WARNING
    handlers: [console]
    propagate: false
  asyncio:
    level: WARNING
    handlers: [console]
    propagate: false

root:
  level: INFO
  handlers: [console]