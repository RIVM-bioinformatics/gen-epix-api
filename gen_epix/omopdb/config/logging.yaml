version: 1
disable_existing_loggers: false

formatters:
  json:
    "()": gen_epix.commondb.domain.json_logging.JsonFormatter
    # optional: set explicit service/env; if omitted it reads SERVICE_NAME / ENVIRONMENT env vars
    service: "omopdb"
    merge_message_json: true
    extras_key: "props"

handlers:
  console:
    class: logging.StreamHandler
    # keep a fixed level; cfg.py set_log_level() will raise/lower levels at runtime anyway
    level: INFO
    formatter: json
    stream: ext://sys.stdout

loggers:
  opomdb.setup:
    level: INFO
    handlers: [console]
    propagate: false
  opomdb.service:
    level: INFO
    handlers: [console]
    propagate: false
  opomdb.app:
    level: INFO
    handlers: [console]
    propagate: false
  opomdb.api:
    level: INFO
    handlers: [console]
    propagate: false
  opomdb.external:
    level: INFO
    handlers: [console]
    propagate: false
  uvicorn.error:
    level: INFO
    handlers: [console]
    propagate: false
  uvicorn.access:
    level: INFO
    handlers: [console]
    propagate: false

root:
  level: INFO
  handlers: [console]