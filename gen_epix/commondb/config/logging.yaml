version: 1
disable_existing_loggers: false

formatters:
  json:
    "()": gen_epix.commondb.domain.json_logging.JsonFormatter
    # optional: set explicit service/env; if omitted it reads SERVICE_NAME / ENVIRONMENT env vars
    service: "commondb"
    merge_message_json: true
    extras_key: "props"

handlers:
  console:
    class: logging.StreamHandler
    # keep a fixed level; cfg.py set_log_level() will raise/lower levels at runtime anyway
    level: INFO
    formatter: json
    stream: ext://sys.stdout

loggers:
  commondb.setup:
    level: INFO
    handlers: [console]
    propagate: false
  commondb.service:
    level: INFO
    handlers: [console]
    propagate: false
  commondb.app:
    level: INFO
    handlers: [console]
    propagate: false
  commondb.api:
    level: INFO
    handlers: [console]
    propagate: false
  commondb.external:
    level: INFO
    handlers: [console]
    propagate: false

root:
  level: INFO
  handlers: [console]