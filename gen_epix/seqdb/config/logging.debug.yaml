version: 1
disable_existing_loggers: false
formatters:
  json:
    "()": gen_epix.commondb.config.json_logging.JsonFormatter
    service: "seqdb"
    merge_message_json: true
    extras_key: "props"
    redacted_value: "[REDACTED]"
    sensitive_keys: ["client_secret", "password", "client_pwd", "secret", "api_key"]
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: json
    stream: ext://sys.stdout
  file:
    class: logging.handlers.TimedRotatingFileHandler
    level: DEBUG
    formatter: json
    filename: ./test/output/log.debug.txt
    when: 'midnight'
    backupCount: 1
    utc: True
    encoding: utf8
loggers:
  seqdb.setup:
    level: DEBUG
    handlers: [console, file]
    propagate: no
  seqdb.service:
    level: DEBUG
    handlers: [console, file]
    propagate: no
  seqdb.app:
    level: DEBUG
    handlers: [console, file]
    propagate: no
  seqdb.api:
    level: DEBUG
    handlers: [console, file]
    propagate: no
  seqdb.external:
    level: DEBUG
    handlers: [console, file]
    propagate: no
root:
  level: INFO
  handlers: [console]
