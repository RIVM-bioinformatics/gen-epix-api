[repository.defaults]
type = "SA_SQLITE"

[repository.defaults.props]
dir = "./data/seqdb/demo"

[repository.abac.props]
file = "@format {this.repository.defaults.props.dir}/seqdb.sa_sqlite.abac.{this.repository.defaults.props.variant}.sqlite"

[repository.organization.props]
file = "@format {this.repository.defaults.props.dir}/seqdb.sa_sqlite.organization.{this.repository.defaults.props.variant}.sqlite"

[repository.system.props]
file = "@format {this.repository.defaults.props.dir}/seqdb.sa_sqlite.system.{this.repository.defaults.props.variant}.sqlite"

[repository.seq.props]
file = "@format {this.repository.defaults.props.dir}/seqdb.sa_sqlite.seq.{this.repository.defaults.props.variant}.sqlite"

[repository.file.props]
file = "@format {this.repository.defaults.props.dir}/seqdb.sa_sqlite.file.{this.repository.defaults.props.variant}.sqlite"
