name: Lint Code and Create Badge

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Run Pylint
        uses: Silleellie/pylint-github-action@v2.1
        with:
          lint-path: gen_epix
          python-version: 3.13.7
          requirements-path: dev-requirements.txt
          readme-path: README.md
          pylintrc-path: ''
          badge-text: PyLint
          color-bad-score: red
          color-ok-score: yellow
          color-good-score: green
          color-perfect-score: brightgreen
