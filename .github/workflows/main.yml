name: Static Analysis and testing

on:
  push:
    branches:
      - dev
      - main
      - test
  pull_request:
    branches:
      - dev
      - test
      - main
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  setup-env:
    name: Setup and cache environment
    permissions:
      contents: read # for actions/checkout to fetch code
      pull-requests: write # for marocchino/sticky-pull-request-comment to create or update PR comment
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.14
      - name: Install ODBC development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev
      - name: Cache pip dependencies
        id: cache-pip
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.venv
          key: ${{ runner.os }}-pip-v2-${{ hashFiles('**/requirements.txt', '**/dev-requirements.txt') }}
      - name: Install dependencies
        if: steps.cache-pip.outputs.cache-hit != 'true'
        run: |
          rm -rf ~/.venv
          python -m venv ~/.venv
          source ~/.venv/bin/activate
          pip install -r requirements.txt
          pip install -r dev-requirements.txt
          pip install --no-binary :all: pyodbc==5.2.*
        # pyodbc is CPU architecture dependent and needs to be installed from source

  formatting:
    name: Formatting
    permissions:
      contents: read
      pull-requests: write
    needs: setup-env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Restore pip dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.venv
          key: ${{ runner.os }}-pip-v2-${{ hashFiles('**/requirements.txt', '**/dev-requirements.txt') }}
      - name: Check imports and formatting
        run: |
          source ~/.venv/bin/activate
          isort --check-only --diff --profile black --float-to-top --line-length=88 .
          black -l 88 --check --diff .
      - name: Comment PR in case of failure
        if: github.event_name == 'pull_request' && failure()
        uses: marocchino/sticky-pull-request-comment@70d2764d1a7d5d9560b100cbea0077fc8f633987 # v3.0.2
        with:
          header: "Code formatting"
          message:
            "Please format your code with [isort](https://pycqa.github.io/isort/) and [black](https://black.readthedocs.io): \
            `isort --check-only --diff --profile black . && black --check --diff .`."
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Linting:
    name: Linting
    permissions:
      contents: read
      pull-requests: write
    needs: setup-env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Restore pip dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.venv
          key: ${{ runner.os }}-pip-v2-${{ hashFiles('**/requirements.txt', '**/dev-requirements.txt') }}
      - name: Run pylint and capture score
        id: pylint-run
        run: |
          source ~/.venv/bin/activate
          # Run pylint but do not let it fail the step (we capture output instead)
          pylint ./gen_epix --disable=C0301 | tee pylint.txt || true
          # Capture the full score line (e.g. "Your code has been rated at 7.36/10 (previous run: 7.29/10, +0.07)")
          score_line=$(grep -m1 "Your code has been rated" pylint.txt || true)
          if [ -z "$score_line" ]; then score_line="Your code has been rated at N/A/10"; fi
          # Export outputs for other steps (use GITHUB_OUTPUT)
          echo "pylint_score_line=$score_line" >> $GITHUB_OUTPUT
      - name: Comment PR with pylint score
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@70d2764d1a7d5d9560b100cbea0077fc8f633987 # v3.0.2
        with:
          header: "Code linting"
          message: |
            🔬 Pylint score output: `${{ steps.pylint-run.outputs.pylint_score_line }}`
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Type-checking:
    name: Type-checking
    permissions:
      contents: read
      pull-requests: write
    needs: setup-env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Restore pip dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.venv
          key: ${{ runner.os }}-pip-v2-${{ hashFiles('**/requirements.txt', '**/dev-requirements.txt') }}
      - name: Run mypy
        run: |
          source ~/.venv/bin/activate
          mypy --config-file mypy.ini ./ || true

  run-tests:
    name: Run Tests
    needs: setup-env
    runs-on: ubuntu-latest
    env:
      CASEDB_IDPS_CONFIG_FILE: ${{ github.workspace }}/gen_epix/casedb/config/idp/no_identity_providers.json
      CASEDB_SECRETS_DIR: ${{ github.workspace }}/gen_epix/casedb/config/.secret
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Restore pip dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.venv
          key: ${{ runner.os }}-pip-v2-${{ hashFiles('**/requirements.txt', '**/dev-requirements.txt') }}
      - name: CI diagnostics (pytest stack)
        run: |
          source ~/.venv/bin/activate
          python -V
          pip freeze | grep -E "pytest|gremlins|xdist" || true
      - name: Run tests
        run: |
          source ~/.venv/bin/activate
          python run.py test_all --include_e2e=False
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: test/output/coverage.xml

  sonarcloud:
    name: SonarCloud Scan
    needs: run-tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0 # Shallow clones should be disabled for SonarCloud analysis
      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-report
          path: test/output/
      - name: SonarCloud Scan
        if: always()
        uses: sonarsource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e # master
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # needed to get PR info
