name: release-please
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment:
      name: PyPI
      url: https://pypi.org/p/gen-epix
    steps:
      - uses: googleapis/release-please-action@v4.2.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
        if: ${{ (steps.release.outputs.prs_created == 'true') }}

      - name: Bump version in pyproject.toml
        id: version_bump
        run: |
          VERSION=${{ steps.release.outputs.version }}
          CURRENT_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')

          if [ "$CURRENT_VERSION" != "$VERSION" ]; then
            echo "Bumping version from $CURRENT_VERSION to $VERSION"
            sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "Version is already at $VERSION, no bump needed"
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi
        if: ${{ (steps.release.outputs.prs_created == 'true') && (steps.release.outputs.release_created != 'true') }}

      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: bump version in pyproject.toml to ${{ steps.release.outputs.version }}"
          commit_options: "--no-verify --signoff"
          push_options: "--force"
        if: ${{ (steps.release.outputs.prs_created == 'true') && (steps.release.outputs.release_created != 'true') && (steps.version_bump.outputs.version_changed == 'true') }}

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: "3.13"
        if: ${{ (steps.release.outputs.release_created == 'true') }}

      - name: Install build packages
        run: |
          python -m pip install --upgrade pip
          pip install build
        if: ${{ (steps.release.outputs.release_created == 'true') }}

      - name: Build package distributions
        run: |
          python -m build --outdir dist
        if: ${{ (steps.release.outputs.release_created == 'true') }}

      - name: Zip dist directory
        run: zip -r distribution-artifacts dist
        if: ${{ (steps.release.outputs.release_created == 'true') }}

      - name: Upload release artifact to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ steps.release.outputs.tag_name }} distribution-artifacts.zip
        if: ${{ (steps.release.outputs.release_created == 'true') }}

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
        if: ${{ (steps.release.outputs.release_created == 'true') }}
