name: release-please
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment:
      name: PyPI
      url: https://pypi.org/p/gen-epix
    steps:
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Switch to release-please branch
        run: |
          # Look for release-please branches
          BRANCH_NAME=$(git branch -r | grep 'origin/release-please--' | head -1 | sed 's/.*origin\///' || echo "")

          if [ -n "$BRANCH_NAME" ]; then
            echo "Switching to branch: $BRANCH_NAME"
            git checkout "$BRANCH_NAME"
          else
            echo "Could not find release-please branch, staying on current branch"
          fi
        if: ${{ (steps.release.outputs.prs_created == 'true') }}

      - name: Bump version in pyproject.toml
        id: version_bump
        run: |
          # Extract version from the release-please manifest or PR title
          if [ -n "${{ steps.release.outputs.version }}" ]; then
            VERSION=${{ steps.release.outputs.version }}
          elif [ -n "${{ steps.release.outputs['--version'] }}" ]; then
            VERSION=${{ steps.release.outputs['--version'] }}
          else
            # Fallback: extract from manifest file
            VERSION=$(jq -r '."."' .release-please-manifest.json)
          fi

          echo "Target version: $VERSION"
          CURRENT_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Current version: $CURRENT_VERSION"

          if [ "$CURRENT_VERSION" != "$VERSION" ]; then
            echo "Bumping version from $CURRENT_VERSION to $VERSION"
            sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "Version is already at $VERSION, no bump needed"
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi
          echo "target_version=$VERSION" >> $GITHUB_OUTPUT
        if: ${{ (steps.release.outputs.prs_created == 'true') }}

      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7
        with:
          commit_message: "chore: bump version in pyproject.toml to ${{ steps.version_bump.outputs.target_version }}"
          commit_options: "--no-verify --signoff"
          push_options: "--force"
        if: ${{ (steps.release.outputs.prs_created == 'true') && (steps.version_bump.outputs.version_changed == 'true') }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
        if: ${{ (steps.release.outputs.release_created == 'true') }}

      - name: Install build packages
        run: |
          python -m pip install --upgrade pip
          pip install build
        if: ${{ (steps.release.outputs.release_created == 'true') }}

      - name: Build package distributions
        run: |
          python -m build --outdir dist
        if: ${{ (steps.release.outputs.release_created == 'true') }}

      - name: Zip dist directory
        run: zip -r distribution-artifacts dist
        if: ${{ (steps.release.outputs.release_created == 'true') }}

      - name: Upload release artifact to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ steps.release.outputs.tag_name }} distribution-artifacts.zip
        if: ${{ (steps.release.outputs.release_created == 'true') }}

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1
        with:
          packages-dir: dist
        if: ${{ (steps.release.outputs.release_created == 'true') }}
