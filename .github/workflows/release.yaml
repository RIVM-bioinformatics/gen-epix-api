name: release-please
on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment:
      name: PyPI
      url: https://pypi.org/p/gen-epix
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ steps.release.outputs.release_created == 'true' }}
        with:
          ref: ${{ steps.release.outputs.tag_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify package version
        run: |
          expected_version="${{ steps.release.outputs.tag_name }}"
          expected_version="${expected_version#v}"
          actual_version=$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as file:
              print(tomllib.load(file)["project"]["version"])
          PY
          )
          echo "Release tag version: $expected_version"
          echo "Package version: $actual_version"
          test "$actual_version" = "$expected_version"
        if: ${{ steps.release.outputs.release_created == 'true' }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
        if: ${{ (steps.release.outputs.release_created == 'true') }}

      - name: Install build packages
        run: |
          python -m pip install --upgrade pip
          pip install build
        if: ${{ (steps.release.outputs.release_created == 'true') }}

      - name: Build package distributions
        run: |
          python -m build --outdir dist
        if: ${{ (steps.release.outputs.release_created == 'true') }}

      - name: Zip dist directory
        run: zip -r distribution-artifacts dist
        if: ${{ (steps.release.outputs.release_created == 'true') }}

      - name: Upload release artifact to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ steps.release.outputs.tag_name }} distribution-artifacts.zip
        if: ${{ (steps.release.outputs.release_created == 'true') }}

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
        if: ${{ (steps.release.outputs.release_created == 'true') }}
