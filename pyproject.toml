[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "Gen-EpiX"
version = "9.0.2"
authors = [
    { name="RIVM-bioinformatics", email="ids-bioinformatics@rivm.nl" },
]
description = "Genomic Epidemiology platform for disease X"
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE"]
keywords = ["Genomic Epidemiology", "Disease X", "Bioinformatics"]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.14"
dependencies = [
    # For compatibility with apache-airflow-core 3.3.0 used in other repositories, fastapi must be pinned to <0.137.0
    # "fastapi[standard]==0.141.1",
    "fastapi[standard]>=0.129.0,<0.137.0", 
    "gunicorn==26.2.*",
    "starlette==1.6.*",
    "httpx==0.28.1",
    "pyjwt==2.13.0",
    "oauthlib==3.3.1",
    "urllib3==2.7.0",
    "sqlalchemy==2.0.52",
    "sqlalchemy_utils==0.42.1",
    "alembic==1.19.2",
    "pydantic==2.13.5",
    "ulid-py==1.1.0",
    "fire==0.7.1",
    "dynaconf==3.3.3",
    "PyYAML==6.0.3",
    "scipy==1.18.1",
    "numpy==2.5.2",
    "biopython==1.88",
    "cachetools==7.1.8",
    "slowapi==0.1.10",
    "python-dateutil==2.9.0.post0",
    "types-python-dateutil==2.9.*",
    "types-setuptools==84.0.*",
    "cryptography==50.0.1",
    "oauthlib==3.3.1",
    "python-multipart==0.0.32",
    "pyinstrument==5.1.*",
]

[project.urls]
Homepage = "https://github.com/RIVM-bioinformatics/gen-epix-api/"
Documentation = "https://rivm-bioinformatics.github.io/gen-epix-api/"

[tool.setuptools.packages.find]
where = ["."]
include = ["gen_epix*"]
exclude = ["tests", "tests.*", "docs", "docs.*", "data", "data.*", "cert", "cert.*", "cicd", "cicd.*"]

[tool.pytest.ini_options]
norecursedirs = ["mutants"]
markers = [
    "scenario_ids(id): Custom marker for scenario IDs used in test reporting.",
    "integration: Marker for integration tests.",
    "performance: Marker for performance/scale tests (skipped by default; use -m performance).",
    "e2e: Marker for end-to-end tests requiring live servers.",
]
addopts = "-v -s"
filterwarnings = ["ignore:.*shadows an attribute in parent.*"]

[tool.pytest-gremlins]
paths = ["gen_epix"]

[tool.black]
line-length = 88
target-version = ['py313']

[tool.isort]
profile = "black"
float_to_top = true
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
ignore = [
    # The repository uses the PEP 257-compatible form where multi-line docstring
    # summaries start on the second line after the opening quotes.
    "D212",
    # Parameter documentation is intentionally semantic and non-duplicative. Ruff
    # cannot determine when an annotated parameter needs extra prose.
    "D417",
]

[tool.ruff.lint.per-file-ignores]
# Existing fastapp docstrings use summary prose followed immediately by the
# detailed description; normalize this legacy style in a later lint phase.
"gen_epix/fastapp/**/*.py" = ["D205"]
"gen_epix/fastapp/*.py" = ["D205"]

[tool.ruff.lint.pydocstyle]
convention = "google"
