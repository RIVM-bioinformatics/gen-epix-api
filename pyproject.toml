[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "Gen-EpiX"
version = "8.1.0"
authors = [
    { name="RIVM-bioinformatics", email="ids-bioinformatics@rivm.nl" },
]
description = "Genomic Epidemiology platform for disease X"
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE"]
keywords = ["Genomic Epidemiology", "Disease X", "Bioinformatics"]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]==0.135.2",
    "gunicorn==25.3.*",
    "starlette==1.0.*",
    "httpx==0.28.1",
    "pyjwt==2.12.1",
    "cryptography==46.0.6",
    "oauthlib==3.3.1",
    "urllib3==2.6.3",
    "sqlalchemy==2.0.48",
    "sqlalchemy_utils==0.42.1",
    "pydantic==2.12.5",
    "ulid-py==1.1.0",
    "fire==0.7.1",
    "dynaconf==3.2.13",
    "PyYAML==6.0.3",
    "scipy==1.17.1",
    "numpy==2.4.4",
    "biopython==1.87",
    "cachetools==7.0.5",
    "slowapi==0.1.9",
    "python-dateutil==2.9.0.post0",
    "types-python-dateutil==2.9.*",
    "types-setuptools==82.0.*",
    "cryptography==48.0.1",
    "oauthlib==3.3.1",
    "python-multipart==0.0.22",
]

[project.urls]
Homepage = "https://github.com/RIVM-bioinformatics/gen-epix-api/"
Documentation = "https://rivm-bioinformatics.github.io/gen-epix-api/"

[tool.setuptools.packages.find]
where = ["."]
include = ["gen_epix*"]
exclude = ["tests", "tests.*", "docs", "docs.*", "data", "data.*", "cert", "cert.*", "cicd", "cicd.*"]

[tool.pytest.ini_options]
norecursedirs = ["mutants"]
markers = [
    "scenario_ids(id): Custom marker for scenario IDs used in test reporting.",
    "integration: Marker for integration tests.",
    "performance: Marker for performance/scale tests (skipped by default; use -m performance).",
]
addopts = "-v -s"
filterwarnings = ["ignore:.*shadows an attribute in parent.*"]

[tool.pytest-gremlins]
paths = ["gen_epix"]

[tool.black]
line-length = 88
target-version = ['py313']

[tool.isort]
profile = "black"
float_to_top = true
line_length = 88
