[mutmut]
paths_to_mutate=
    gen_epix
do_not_mutate=
    */.venv/*
    */venv/*
    */ENV/*
    */.tox/*
    */.nox/*
    */.pytest_cache/*
    */.mypy_cache/*
    */build/*
    */dist/*
    */htmlcov/*
    */test/output/*
    */mutants/*
    gen_epix/filter/base.py
    gen_epix/filter/composite.py
also_copy=
    cert
    config
    data
    docs
    etl.py
    run.py
pytest_add_cli_args=
    -s
    -v
    -W
    ignore::DeprecationWarning
    -W
    ignore::pytest.PytestAssertRewriteWarning
    -W
    ignore::sqlalchemy.exc.SAWarning
pytest_add_cli_args_test_selection=
    test/filter/unit
    test/transform/unit
    test/fastapp/unit
    test/commondb/unit
    test/commondb/integration
    test/casedb/unit
    test/seqdb/unit
    test/seqdb/integration
    test/omopdb/unit
    test/omopdb/integration
    test/general/docs
    test/end_to_end