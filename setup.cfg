[mutmut]
paths_to_mutate=
    gen_epix
# Exclude module-level import package that binds `dict` name and collides with mutmut's
# injected `MutantDict = Annotated[dict[str, Callable], ...]` trampoline alias.
do_not_mutate=
    */.venv/*
    */venv/*
    */ENV/*
    */.tox/*
    */.nox/*
    */.pytest_cache/*
    */.mypy_cache/*
    */build/*
    */dist/*
    */htmlcov/*
    */test/output/*
    */mutants/*
    gen_epix/filter/base.py
    gen_epix/filter/composite.py
    gen_epix/fastapp/repositories/__init__.py
    # mutmut trampolines currently wrap async callables as sync `def`, which breaks
    # FastAPI dependency inspection for auth dependency callables in this package.
    gen_epix/fastapp/services/auth/*.py
    */gen_epix/fastapp/services/auth/*.py
    # mutmut helper names collide when superclass/subclass share class+method names
    # (here BaseRbacService.__init__), causing recursive trampoline dispatch.
    gen_epix/fastapp/services/rbac/service.py
    gen_epix/commondb/domain/service/rbac.py
    */gen_epix/fastapp/services/rbac/service.py
    */gen_epix/commondb/domain/service/rbac.py
    # mutmut helper names collide when superclass/subclass share class+method names
    # (here AbacService.register_policies), causing recursive trampoline dispatch.
    gen_epix/commondb/services/abac.py
    gen_epix/casedb/services/abac.py
    */gen_epix/commondb/services/abac.py
    */gen_epix/casedb/services/abac.py
    # mutmut helper names collide when multiple modules define AppComposer.__init__
    # in an inheritance chain (commondb/casedb/seqdb/omopdb), causing broken super calls.
    gen_epix/commondb/env.py
    gen_epix/casedb/env.py
    gen_epix/seqdb/env.py
    gen_epix/omopdb/env.py
    */gen_epix/commondb/env.py
    */gen_epix/casedb/env.py
    */gen_epix/seqdb/env.py
    */gen_epix/omopdb/env.py
also_copy=
    cert
    config
    data
    docs
    etl.py
    run.py
pytest_add_cli_args=
    -s
    -v
    -W
    ignore::DeprecationWarning
    -W
    ignore::pytest.PytestAssertRewriteWarning
    -W
    ignore::sqlalchemy.exc.SAWarning
pytest_add_cli_args_test_selection=
    test/filter/unit
    test/transform/unit
    test/fastapp/unit
    test/commondb/unit
    test/commondb/integration
    test/casedb/unit
    test/seqdb/unit
    test/seqdb/integration
    test/omopdb/unit
    test/omopdb/integration
    test/general/docs
    test/end_to_end
